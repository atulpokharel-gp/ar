name: Validate FieldGuide
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  iphone-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone simulator target
        run: xcodebuild -project FieldGuide.xcodeproj -scheme FieldGuide -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
